[project]
name = "swarm-audit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "modal",
    "numpy",
    "scipy",
    "pandas",
    "networkx",
    "matplotlib",
    "pyyaml",
]
# vLLM runs inside the Modal image (Linux), so it is not a local dependency.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["swarm_audit"]
